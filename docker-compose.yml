      AIRFLOW_MCP_MAX_RESPONSE_CHARS: ${AIRFLOW_MCP_MAX_RESPONSE_CHARS:-20000}
      AIRFLOW_MCP_MAX_LOG_BATCHES_PER_REQUEST: ${AIRFLOW_MCP_MAX_LOG_BATCHES_PER_REQUEST:-500}
