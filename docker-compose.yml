      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-${AIRFLOW_ADMIN_USER:-admin}}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-${AIRFLOW_ADMIN_PASSWORD:-admin}}
      AIRFLOW_MCP_REQUEST_TIMEOUT_SECONDS: ${AIRFLOW_MCP_REQUEST_TIMEOUT_SECONDS:-30}
