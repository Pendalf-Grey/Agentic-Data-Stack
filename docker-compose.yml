      ADS_LLM_LOG_INDEX_LIKE: ${ADS_LLM_LOG_INDEX_LIKE:-nginx-logs-%}
      ADS_LLM_LOG_ANALYSIS_STRATEGY: ${ADS_LLM_LOG_ANALYSIS_STRATEGY:-context}
      ADS_LLM_LOG_RAW_CHUNK_MODE: ${ADS_LLM_LOG_RAW_CHUNK_MODE:-full_period}
      ADS_LLM_LOG_BATCH_ROWS: ${ADS_LLM_LOG_BATCH_ROWS:-5}
      ADS_LLM_LOG_CHUNK_MAX_ROWS: ${ADS_LLM_LOG_CHUNK_MAX_ROWS:-${ADS_LLM_LOG_BATCH_ROWS:-5}}
      ADS_LLM_LOG_MAX_CHUNKS: ${ADS_LLM_LOG_MAX_CHUNKS:-0}
      ADS_LLM_CONTEXT_WINDOW_LIMIT: ${ADS_LLM_CONTEXT_WINDOW_LIMIT:-120}
      ADS_LLM_CONTEXT_RARE_EVENT_LIMIT: ${ADS_LLM_CONTEXT_RARE_EVENT_LIMIT:-80}
      ADS_LLM_CONTEXT_TOP_TRACE_LIMIT: ${ADS_LLM_CONTEXT_TOP_TRACE_LIMIT:-60}
      ADS_LLM_CONTEXT_RAW_SAMPLE_LIMIT: ${ADS_LLM_CONTEXT_RAW_SAMPLE_LIMIT:-80}
      ADS_LLM_CONTEXT_RAW_SAMPLE_CHARS: ${ADS_LLM_CONTEXT_RAW_SAMPLE_CHARS:-2500}
      ADS_LLM_CONTEXT_SLOW_LATENCY_MS: ${ADS_LLM_CONTEXT_SLOW_LATENCY_MS:-1000}
      ADS_LLM_LOG_RESULT_DATABASE: ${ADS_LLM_LOG_RESULT_DATABASE:-${CLICKHOUSE_DB:-analytics}}
      ADS_LLM_LOG_INVESTIGATIONS_TABLE: ${ADS_LLM_LOG_INVESTIGATIONS_TABLE:-llm_log_investigations}
      ADS_LLM_LOG_CHUNK_REPORTS_TABLE: ${ADS_LLM_LOG_CHUNK_REPORTS_TABLE:-llm_log_chunk_reports}
      ADS_LLM_LOG_REFINED_SQL_TABLE: ${ADS_LLM_LOG_REFINED_SQL_TABLE:-llm_log_refined_sql}
      LLM_LOG_START: ${LLM_LOG_START:-2024-06-16T00:00:00Z}
      LLM_LOG_END: ${LLM_LOG_END:-2026-06-16T00:00:00Z}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import Request, urlopen; urlopen(Request('http://localhost:8000/sse', method='HEAD'), timeout=5).close()\""]
      interval: ${ADS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${ADS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${ADS_HEALTHCHECK_RETRIES:-10}
      start_period: ${ADS_HEALTHCHECK_START_PERIOD:-30s}
    restart: unless-stopped

  librechat:
    image: ghcr.io/danny-avila/librechat@sha256:a46254938507971e0d4f7ed3f9d116bd9b118f4810b5b75eb716baf575645068
    depends_on:
      librechat-db:
        condition: service_healthy
      rag_api:
        condition: service_healthy
      mcp-clickhouse:
        condition: service_healthy
      mcp-grafana:
        condition: service_healthy
      mcp-adcore:
        condition: service_healthy
      mcp-airflow:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://librechat-db:27017/LibreChat
      DOMAIN_CLIENT: http://localhost:3080
      DOMAIN_SERVER: http://localhost:3080
      JWT_SECRET: ${JWT_SECRET:-${LIBRECHAT_JWT_SECRET:-change-me-generate-secure-jwt-secret}}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-${LIBRECHAT_JWT_REFRESH_SECRET:-change-me-generate-secure-jwt-refresh-secret}}
      ALLOW_EMAIL_LOGIN: ${ALLOW_EMAIL_LOGIN:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_UNVERIFIED_EMAIL_LOGIN: ${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
      ALLOW_PASSWORD_RESET: ${ALLOW_PASSWORD_RESET:-false}
      KIMI_API_KEY: ${KIMI_API_KEY:-${MOONSHOT_API_KEY:-}}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      KIMI_ONLY: ${KIMI_ONLY:-true}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.6}
      KIMI_MODELS: ${KIMI_MODELS:-kimi-k2.6}
      KIMI_TITLE_MODEL: ${KIMI_TITLE_MODEL:-kimi-k2.6}
      KIMI_SUMMARY_MODEL: ${KIMI_SUMMARY_MODEL:-kimi-k2.6}
      KIMI_THINKING_TYPE: ${KIMI_THINKING_TYPE:-disabled}
      KIMI_REASONING_PARAMS_ENABLED: ${KIMI_REASONING_PARAMS_ENABLED:-auto}
      KIMI_REASONING_EFFORT: ${KIMI_REASONING_EFFORT:-none}
      KIMI_INCLUDE_REASONING: ${KIMI_INCLUDE_REASONING:-false}
      KIMI_REASONING_EXCLUDE: ${KIMI_REASONING_EXCLUDE:-true}
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: ${RAG_API_URL:-http://rag_api:8000}
      MODEL: ${MODEL:-qwen2.5:7b}
      MODEL_FAST: ${MODEL_FAST:-qwen2.5:7b}
      MODEL_SMART: ${MODEL_SMART:-qwen3:14b}
      MODEL_VISION: ${MODEL_VISION:-llama3.2-vision:latest}
      MODEL_EMBEDDING: ${MODEL_EMBEDDING:-nomic-embed-text:latest}
      LIBRECHAT_MODELS: ${LIBRECHAT_MODELS:-qwen2.5:7b,qwen2.5:14b,qwen3:14b,llama3.2-vision:latest}
      LOCAL_OLLAMA_MODELS: ${LOCAL_OLLAMA_MODELS:-qwen2.5:7b,qwen2.5:14b,qwen3:14b,llama3.2-vision:latest}
      CLOUD_MODEL_ENABLED: ${CLOUD_MODEL_ENABLED:-false}
      CLOUD_MODEL_API_KEY: ${CLOUD_MODEL_API_KEY:-}
      CLOUD_MODEL_BASE_URL: ${CLOUD_MODEL_BASE_URL:-}
      CLOUD_MODEL_MODELS: ${CLOUD_MODEL_MODELS:-}
      CLOUD_MODEL_TITLE_MODEL: ${CLOUD_MODEL_TITLE_MODEL:-}
      CLOUD_MODEL_SUMMARY_MODEL: ${CLOUD_MODEL_SUMMARY_MODEL:-}
      LIBRECHAT_TITLE_MODEL: ${LIBRECHAT_TITLE_MODEL:-qwen2.5:7b}
      LIBRECHAT_SUMMARY_MODEL: ${LIBRECHAT_SUMMARY_MODEL:-qwen2.5:7b}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      ADS_ANALYTICS_DATABASE: ${ADS_ANALYTICS_DATABASE:-}
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-http://localhost:3001}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      LANGFUSE_MCP_BASIC_TOKEN: ${LANGFUSE_MCP_BASIC_TOKEN}
      NO_INDEX: "true"
    ports:
      - "3080:3080"
    volumes:
      - ./librechat/librechat.yaml.template:/app/librechat.yaml.template:ro
      - ./librechat/render-config.sh:/app/render-config.sh:ro
      - ./uploads:/app/uploads
    command: sh /app/render-config.sh
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3080"]
      interval: ${ADS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${ADS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${ADS_HEALTHCHECK_RETRIES:-10}
      start_period: ${ADS_HEALTHCHECK_LONG_START_PERIOD:-60s}
    restart: unless-stopped

