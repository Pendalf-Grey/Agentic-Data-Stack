      ADCORE_USERNAME: ${ADCORE_USERNAME:-}
      ADCORE_PASSWORD: ${ADCORE_PASSWORD:-}
      ADCORE_DEFAULT_ACCESS_LEVELS: ${ADCORE_DEFAULT_ACCESS_LEVELS:-readonly}
      ADCORE_REQUEST_TIMEOUT_SECONDS: ${ADCORE_REQUEST_TIMEOUT_SECONDS:-60}
      ADCORE_VERIFY_TLS: ${ADCORE_VERIFY_TLS:-true}
      ADCORE_MAX_RESPONSE_CHARS: ${ADCORE_MAX_RESPONSE_CHARS:-12000}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import Request, urlopen; urlopen(Request('http://localhost:8000/sse', method='HEAD'), timeout=5).close()\""]
      interval: ${ADS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${ADS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${ADS_HEALTHCHECK_RETRIES:-10}
      start_period: ${ADS_HEALTHCHECK_START_PERIOD:-30s}
    restart: unless-stopped

  mcp-airflow:
