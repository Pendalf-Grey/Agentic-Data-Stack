      AIRFLOW_MCP_AUTO_SCALE_BATCH_ROWS: ${AIRFLOW_MCP_AUTO_SCALE_BATCH_ROWS:-true}
      AIRFLOW_MCP_CANCEL_ON_TIMEOUT: ${AIRFLOW_MCP_CANCEL_ON_TIMEOUT:-true}
