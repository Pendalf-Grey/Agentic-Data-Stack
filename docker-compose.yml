      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics_password}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-analytics}
      ADS_LLM_LOG_REFINEMENT_DAG_ID: ${ADS_LLM_LOG_REFINEMENT_DAG_ID:-llm_guided_log_sql_refinement}
      ADS_LLM_LOG_SOURCE_TABLE: ${ADS_LLM_LOG_SOURCE_TABLE:-analytics.elasticsearch_events_raw}
