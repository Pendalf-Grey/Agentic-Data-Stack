version: 1.2.1

cache: true

interface:
  mcpServers:
    use: true
    share: false
    create: false
    public: false

endpoints:
  custom:
    - name: "Local Ollama"
      apiKey: "${LLM_GATEWAY_API_KEY}"
      baseURL: "${LLM_GATEWAY_BASE_URL}"
      models:
        default:
          - "qwen2.5:7b"
          - "qwen2.5:14b"
          - "qwen3:14b"
          - "llama3.2-vision:latest"
        fetch: false
      titleConvo: true
      titleModel: "qwen2.5:7b"
      summarize: false
      summaryModel: "qwen2.5:7b"

mcpServers:
  clickhouse-playground:
    type: sse
    url: http://host.docker.internal:8001/sse
